[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-bridge"
version = "1.1.0"
description = "Antigravity CLI & IDE delegation bridge for Grok, Claude Code, and Cline via MCP"
readme = "README.md"
authors = [
    { name = "Bridge Contributors" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
bridge-mcp-server = "bridge.server:main"
agy-cli-mcp = "agy_cli.server:main"

[tool.setuptools]
packages = ["bridge", "agy_cli"]
